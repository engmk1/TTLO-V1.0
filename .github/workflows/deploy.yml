# CI: every push and pull request runs the TTLO checks (npm test).
# Deployment is done by Cloudflare itself (Workers Builds, connected to this repository),
# so a red cross here means: do not trust that version until the failing check is fixed.
name: Test TTLO
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
